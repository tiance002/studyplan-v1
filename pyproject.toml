[project]
name = "studyplan"
version = "1.1.0"
description = "学习规划助手 V1.1 — LangGraph 编排 + FastAPI 接入 + PostgreSQL 业务事实源"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn>=0.32,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
# PostgreSQL 持久化 + LangGraph Checkpointer。
# ⚠️ psycopg 是 LGPL-3.0-only：作为依赖引入且不修改其源码；
#    分发时须随附许可证文本。详见 docs/migration/module-reuse-matrix.md §2.2。
# 已在本机验证的版本（B1 验收）：psycopg 3.3.6 / alembic 1.20.0 / SQLAlchemy 2.1.1。
postgres = [
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "SQLAlchemy>=2.0,<3.0",
]
# LangGraph 编排层 + Postgres Checkpointer（ADR-0005）。
# 独立于 postgres extra：逻辑层测试不需要任何框架即可运行。
# 已在本机验证的版本（B1 验收）：langgraph 1.2.12 / langgraph-checkpoint-postgres 3.1.2。
agent = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "postgres: 需要本地 PostgreSQL 运行；不可达时整组跳过",
    "langgraph: 需要安装 langgraph 才能运行（B1 骨架可用解释器替代）",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["var", ".venv", "node_modules", "frontend"]

[tool.ruff.lint]
# 只启用能发现**真实缺陷**的规则集，不做纯风格约束（风格交给 formatter）。
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入**必须**在参数默认值里调用 `Depends()` / `Query()`，
# 这是框架的既定用法而非可变默认值缺陷。把它们声明为「不可变调用」，
# 使 B008 只对真正的可变默认值（list()/dict()/set()）报警。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]

[tool.mypy]
# `app` 包位于 backend/ 下；显式声明搜索路径，使 `import app.*` 可解析。
mypy_path = "backend"
explicit_package_bases = true
namespace_packages = true
python_version = "3.11"
# 骨架阶段：宽松起步，仅捕获真实类型缺陷，不做全量严格模式。
# 严格化随 B2/B3 逐步推进（见 docs/acceptance/B1-report.md §6）。
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = false
allow_redefinition = true
disallow_untyped_defs = false
exclude = ["^backend/tests/", "^frontend/", "^var/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
