    @media(max-width:1050px){.content{padding:22px 25px 45px}.stage-body{padding-left:26px}.stage-columns{gap:22px;grid-template-columns:1fr 1fr}.revision-layout{grid-template-columns:1fr}.history-panel{display:grid;grid-template-columns:1fr 1fr;gap:25px}.history-panel>.history-detail{border-top:0;margin:0;padding:0}}

  <a class="skip" href="#main-content">跳到学习计划</a>
  <nav class="sidebar" aria-label="全局导航">
    <div class="brand"><span class="brand-mark">S·</span><div><strong>Study Plan</strong><small>学习工作室</small></div></div>
    <div class="nav-label">学习空间</div><div id="desktop-nav"></div>
    <div class="nav-bottom"><button class="nav-link" data-nav="模型设置"><span aria-hidden="true">⚙</span>模型设置</button><div class="profile"><span class="avatar">演</span><div>演示学习者<small class="muted" style="display:block">本地原型</small></div></div></div>
  </nav>
  <div class="shell">
    <header class="topbar"><div class="row"><button class="icon-btn mobile-menu" data-action="menu" aria-label="打开导航">☰</button><div class="breadcrumbs">学习空间<span>/</span>学习计划</div></div><button class="text-btn" data-action="about">评审说明</button></header>
    <main class="content" id="main-content">
      <div class="demo-bar"><div class="demo-caption"><strong>交互原型</strong>合成演示内容，不连接真实服务</div><div class="demo-control"><label for="demo-state">演示场景</label><select id="demo-state"><option value="initial">A · 初始规划</option><option value="clarify">B · 需要澄清</option><option value="generating">C · 生成过程</option><option value="draft">D · 完整课程草案</option><option value="incomplete">E · 未完成草案</option><option value="revision">F · 调整与版本历史</option></select></div></div>
      <div id="screen" tabindex="-1"></div>
      <noscript><div class="notice warning">此交互原型需要启用 JavaScript。文件内包含全部脚本，不需要网络。</div></noscript>
    </main>
  </div>
  <dialog id="supplement-dialog" aria-labelledby="supplement-title">
    <form id="supplement-form">
      <div class="dialog-head"><div><h2 id="supplement-title">补充信息</h2><p class="muted small">按需填写。没有确定的内容可以留空。</p></div><button class="icon-btn" type="button" data-close aria-label="关闭补充信息">×</button></div>
      <div class="dialog-body form-grid">
        <label class="wide">已有基础<textarea name="starting" rows="2" placeholder="例如：我已经会 Python，了解基本 HTTP 请求。"></textarea><span class="hint">已有能力作为起点，不默认安排复习或测试。</span></label>
        <label>学习范围<input name="scope" placeholder="想覆盖什么，暂时不学什么"></label>
        <label>学习深度<select name="depth"><option value="">暂不确定</option><option>了解概念</option><option>能够独立实现</option><option>能够验证与改进</option></select></label>
        <label class="wide">成果用途<select name="purpose"><option value="">暂不确定</option><option>个人学习</option><option>完成自己的项目</option><option>展示项目与面试成果</option></select><span class="hint">用途帮助说明成果要求，不自动添加无关课程。</span></label>
        <label class="wide">硬约束<textarea name="constraints" rows="2" placeholder="例如：教程必须免费；程序只读，不允许自动修改文件。"></textarea></label>
        <label class="wide">已有项目背景<textarea name="project" rows="3" placeholder="已有项目做什么、使用什么技术、希望基于它增加什么能力。"></textarea><span class="hint">优先在你的项目上持续实践；学习别人的源码是独立的可选安排。</span></label>
      </div>
      <div class="dialog-footer"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">保存补充信息</button></div>
    </form>
  </dialog>
  <dialog id="info-dialog" aria-labelledby="info-title"><div class="dialog-head"><h2 id="info-title"></h2><button class="icon-btn" data-close aria-label="关闭详情">×</button></div><div class="dialog-body" id="info-body"></div><div class="dialog-footer"><button class="btn" data-close>关闭</button></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-head"><h2 id="confirm-title"></h2><button class="icon-btn" data-close aria-label="关闭确认">×</button></div><div class="dialog-body"><p id="confirm-description"></p><div class="notice"><p>只切换本页的演示状态，不会创建或更改正式学习计划。</p></div><label class="check-row" style="margin-top:18px"><input type="checkbox" id="confirm-check"><span id="confirm-consent"></span></label></div><div class="dialog-footer"><button class="btn" data-close>返回查看</button><button class="btn primary" id="confirm-submit" disabled>确认采用（演示）</button></div></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    // All learning content is synthetic. This file intentionally has no API or persistence adapter.
    const $ = (s) => document.querySelector(s);
    const esc = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon = (name) => '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="' + ({home:'M3 11 12 3l9 8M5 10v11h14V10M9 21v-7h6v7',plan:'M4 4h16v16H4zM8 4v16M8 9h12M8 14h12',path:'M5 5h8a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h10M16 18l3 3-3 3',book:'M4 4h7l1 2 1-2h7v16h-7l-1 1-1-1H4zM12 6v15',chat:'M4 4h16v13H9l-5 4z',note:'M5 3h14v18H5zM8 8h8M8 12h8M8 16h5',project:'M9 6V3h6v3M3 6h18v15H3zM3 12h18',down:'m6 9 6 6 6-6',check:'m5 12 4 4L19 6',lock:'M6 10h12v11H6zM8 10V6a4 4 0 0 1 8 0v4'}[name] || 'M5 12h14') + '"/></svg>';
    const navItems = [['学习工作台','home'],['学习计划','plan'],['学习路径','path'],['阶段学习','book'],['我的会话','chat'],['阶段总结','note'],['项目实践','project']];

      if(e.target.id==='goal-form'){if(!state.goal.trim()){$('#goal-error').hidden=false;$('#goal-input').focus();return}state.adopted=false;go('generating')}
      if(e.target.id==='supplement-form'){const data=new FormData(e.target);for(const k of Object.keys(state.info))state.info[k]=String(data.get(k)||'');closeDialog($('#supplement-dialog'));render();toast('补充信息已暂存于本页，刷新后重置。')}
      if(e.target.id==='clarify-form'){const data=new FormData(e.target);state.answers=[String(data.get('answer1')),String(data.get('answer2'))];$('#answer-feedback').hidden=false;$('#clarify-continue').hidden=false;$('#answer-feedback').textContent='答案已暂存（仅本页）。真实产品需重新核对冲突，当前不宣称问题已解决。';toast('已暂存补充答案。')}
    });
    $('#confirm-submit').addEventListener('click',()=>{
      if(!$('#confirm-check').checked)return;
      if(confirmKind==='revision'){if(!state.preview)return;state.edit=state.preview.description;state.swap=state.preview.swap;state.revision=2;state.adopted=true;state.preview=null;closeDialog($('#confirm-dialog'));render(true);toast('已采用版本2（仅本页演示），版本1历史保留。')}
      else{state.adopted=true;closeDialog($('#confirm-dialog'));render(true);toast('演示计划已采用，正式产品数据没有变化。')}
    });
    document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog(d)}}));
    render();
  </script>
</body>
</html>
