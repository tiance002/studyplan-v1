# Alembic configuration.
#
# THIS FILE IS INTENTIONALLY PURE ASCII.
#   configparser reads it with encoding="locale", which on a Chinese Windows
#   is GBK. A UTF-8 Chinese comment therefore crashes `alembic` with
#   UnicodeDecodeError before any of our own Python runs.
#
# THIS FILE CONTAINS NO DATABASE URL AND NO PASSWORD.
#   alembic/env.py reads the connection string from the environment:
#
#     STUDYPLAN_MIGRATION_DSN
#
#   The migration role and the application role MUST be different:
#   migrations need DDL rights, and the application role (studyplan_app) must
#   not have them - otherwise one mistake can alter table structure or
#   sidestep RLS entirely. See docs/adr/ADR-0003-database-role-isolation.md.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
